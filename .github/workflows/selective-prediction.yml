name: Selective Prediction Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .

      - name: Run selective prediction and leakage tests
        run: pytest tests/test_pipeline.py tests/test_model_training.py tests/test_selective_prediction.py

      - name: Build leakage-safe silver development data
        run: python build_training_dataset.py

      - name: Run nested selective prediction research
        run: python run_selective_prediction.py

      - name: Show selective prediction report
        run: cat artifacts/selective_prediction/selective_prediction_report.json

      - name: Upload selective prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silver-selective-prediction-research
          path: artifacts/selective_prediction/
          if-no-files-found: error
