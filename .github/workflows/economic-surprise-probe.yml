name: Economic Surprise Data Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Probe point-in-time US calendar with limited guest access
        run: python probe_economic_calendar_access.py > economic-calendar-probe.json

      - name: Show probe
        if: always()
        run: test -f economic-calendar-probe.json && cat economic-calendar-probe.json || true

      - name: Upload probe artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: economic-calendar-access-probe
          path: economic-calendar-probe.json
          if-no-files-found: error
