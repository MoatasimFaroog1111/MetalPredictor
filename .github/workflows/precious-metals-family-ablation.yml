name: Precious Metals Family Ablation

on:
  push:
    branches: ["research/precious-metals-family-ablation-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .

      - name: Run causal source, coverage, provenance, and ablation tests
        run: |
          pytest tests/test_pipeline.py \
            tests/test_model_training.py \
            tests/test_cross_asset_precious_metals.py \
            tests/test_precious_metals_coverage.py \
            tests/test_precious_metals_provenance.py \
            tests/test_dukascopy_public_precious_metals.py \
            tests/test_precious_metals_ablation.py

      - name: Build frozen Silver baseline development data
        run: python build_training_dataset.py

      - name: Build keyless XPT and XPD H1 research data
        run: python build_precious_metals_dataset.py

      - name: Build pre-registered 43-feature XPT/XPD candidate data
        run: python build_precious_metals_cross_asset_dataset.py

      - name: Run pre-registered family ablation and stability comparisons
        run: python run_precious_metals_family_ablation.py

      - name: Show compact ablation result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/cross_asset_precious_metals/ablation_v1/precious_metals_family_ablation_report.json')
          r=json.loads(p.read_text())
          print('status:', r['status'])
          print('registry:', r['registry_fingerprint_sha256'])
          print('full_43_improvement_percent:', r['full_43_reference']['mae_improvement_percent'])
          print('retained_families:', r['parsimonious_candidate']['retained_families'])
          print('retained_candidate_feature_count:', r['parsimonious_candidate']['retained_candidate_feature_count'])
          print('total_model_feature_count:', r['parsimonious_candidate']['total_model_feature_count'])
          print('family classifications:')
          for row in r['families']:
              print(
                  row['family'],
                  row['classification'],
                  'retain=', row['retain_in_parsimonious_candidate'],
                  'addon_pct=', row['addon_evidence']['mae_improvement_percent'],
                  'conditional_pct=', row['conditional_evidence']['mae_improvement_percent'],
              )
          print('diagnostic_vs_base:', r['parsimonious_candidate']['diagnostic_vs_base'])
          print('diagnostic_full_vs_retained:', r['parsimonious_candidate']['diagnostic_full_43_vs_retained'])
          PY

      - name: Assert scientific isolation and no automatic promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/cross_asset_precious_metals/ablation_v1/precious_metals_family_ablation_report.json')
          r=json.loads(p.read_text())
          assert r['status'] == 'PASS'
          assert r['pre_registered_before_family_results'] is True
          assert r['family_count'] == 7
          assert r['candidate_feature_count'] == 43
          assert r['coverage_gate']['status'] == 'PASS'
          assert r['coverage_gate']['policy_fixed_before_result'] is True
          assert r['parsimonious_candidate']['selection_rule_fixed_before_family_results'] is True
          assert r['parsimonious_candidate']['selection_derived_on_same_development_data'] is True
          assert r['parsimonious_candidate']['live_promotion_eligible'] is False
          assert r['parsimonious_candidate']['requires_new_or_nested_validation_before_any_promotion'] is True
          assert r['research_policy']['old_test_read'] is False
          assert r['research_policy']['future_holdout_read'] is False
          assert r['guardrails']['edge_status'] == 'NOT_PROVEN'
          assert r['guardrails']['live_model_mutated'] is False
          assert r['guardrails']['frozen_52_feature_graph_mutated'] is False
          assert r['guardrails']['buy_sell_enabled'] is False
          assert r['guardrails']['execution_enabled'] is False
          print('Ablation research isolation guards: PASS')
          PY

      - name: Upload family-ablation research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: precious-metals-family-ablation-v1
          path: |
            data/market/XPTUSD_H1_USD_PER_KG_quality_report.json
            data/market/XPDUSD_H1_USD_PER_KG_quality_report.json
            data/market/precious_metals_source_report.json
            artifacts/cross_asset_precious_metals/ablation_v1/
          if-no-files-found: error
