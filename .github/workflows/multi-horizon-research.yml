name: BullionVault Multi-Horizon Research

on:
  pull_request:
    paths:
      - "src/metal_predictor/multi_horizon/**"
      - "research_data/bullionvault_horizons/**"
      - "tests/test_multi_horizon_stage1.py"
      - "MULTI_HORIZON_RESEARCH.md"
      - ".github/workflows/multi-horizon-research.yml"
  push:
    branches:
      - "research/bullionvault-multi-horizon-stage1"
    paths:
      - "src/metal_predictor/multi_horizon/**"
      - "research_data/bullionvault_horizons/**"
      - "tests/test_multi_horizon_stage1.py"
      - "MULTI_HORIZON_RESEARCH.md"
      - ".github/workflows/multi-horizon-research.yml"

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile isolated module
        run: python -m compileall -q src/metal_predictor/multi_horizon
      - name: Verify provenance and guardrails
        run: python -m pytest tests/test_multi_horizon_stage1.py
