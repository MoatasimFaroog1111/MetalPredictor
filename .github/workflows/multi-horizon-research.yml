name: BullionVault Multi-Horizon Research

on:
  pull_request:
    paths:
      - "src/metal_predictor/multi_horizon/**"
      - "research_data/bullionvault_horizons/**"
      - "tests/test_multi_horizon_stage1.py"
      - "tests/test_multi_horizon_stage2.py"
      - "tests/test_multi_horizon_stage3.py"
      - "tests/test_multi_horizon_stage6_prereg.py"
      - "build_multi_horizon_stage2.py"
      - "run_multi_horizon_stage3.py"
      - "MULTI_HORIZON_RESEARCH.md"
      - "MULTI_HORIZON_STAGE6.md"
      - ".github/workflows/multi-horizon-research.yml"
  push:
    branches: ["research/bullionvault-multi-horizon-stage3"]
    paths:
      - "src/metal_predictor/multi_horizon/**"
      - "research_data/bullionvault_horizons/**"
      - "tests/test_multi_horizon_stage1.py"
      - "tests/test_multi_horizon_stage2.py"
      - "tests/test_multi_horizon_stage3.py"
      - "tests/test_multi_horizon_stage6_prereg.py"
      - "build_multi_horizon_stage2.py"
      - "run_multi_horizon_stage3.py"
      - "MULTI_HORIZON_RESEARCH.md"
      - "MULTI_HORIZON_STAGE6.md"
      - ".github/workflows/multi-horizon-research.yml"

permissions:
  contents: read

jobs:
  stage3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q src/metal_predictor/multi_horizon run_multi_horizon_stage3.py
      - name: Test isolated research module
        run: python -m pytest tests/test_multi_horizon_stage1.py tests/test_multi_horizon_stage2.py tests/test_multi_horizon_stage3.py tests/test_multi_horizon_stage6_prereg.py
      - name: Run development-only comparison
        run: python run_multi_horizon_stage3.py
      - name: Verify reserved test remains sealed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/multi_horizon_stage3/development_report.json').read_text())
          assert p['performance_scope'] == 'DEVELOPMENT_ONLY'
          assert p['historical_test_metrics_read'] is False
          assert p['historical_test_predictions_computed'] is False
          assert p['horizons']['1d']['state'] == 'DATA_PENDING'
          for key in ('4h','12h','2d','30d'):
              h = p['horizons'][key]['historical_test']
              assert h['metrics_read'] is False
              assert h['predictions_computed'] is False
              assert h['used_for_fit'] is False
              assert h['used_for_selection'] is False
          locked = Path('research_data/bullionvault_horizons/stage3_development_selection.json')
          if locked.exists():
              assert json.loads(locked.read_text()) == p
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bullionvault-multi-horizon-stage3-development-report
          path: artifacts/multi_horizon_stage3/development_report.json
          if-no-files-found: error
