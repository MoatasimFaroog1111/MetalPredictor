name: Training Data Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest

      - name: Build real training dataset
        run: python build_training_dataset.py

      - name: Show quality report
        run: cat data/processed/data_quality_report.json

      - name: Upload processed training data
        uses: actions/upload-artifact@v4
        with:
          name: silver-training-data
          path: data/processed/
          if-no-files-found: error
