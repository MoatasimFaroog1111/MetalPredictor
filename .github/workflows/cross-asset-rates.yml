name: Cross-Asset Treasury Rates Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rates-feature-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .

      - name: Run component and leakage tests
        run: pytest tests/test_pipeline.py tests/test_model_training.py tests/test_cross_asset_rates.py

      - name: Build silver baseline training data
        run: python build_training_dataset.py

      - name: Build publication-aware Treasury rates dataset
        run: python build_treasury_rates_dataset.py

      - name: Show Treasury source and timing report
        run: cat data/market/UST_2Y_10Y_quality_report.json

      - name: Build silver plus Treasury-rates training data
        run: python build_rates_cross_asset_dataset.py

      - name: Compare A silver-only vs D silver-plus-rates on development only
        run: python compare_rates_features.py

      - name: Show paired rates feature report
        run: cat artifacts/cross_asset_rates/rates_ad_report.json

      - name: Upload rates research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silver-treasury-rates-research
          path: |
            data/market/UST_2Y_10Y_H15_PUBLICATION_AWARE.parquet
            data/market/UST_2Y_10Y_H15_PUBLICATION_AWARE.csv
            data/market/UST_2Y_10Y_quality_report.json
            data/processed_rates/
            artifacts/cross_asset_rates/
          if-no-files-found: error
