name: Live Prediction Platform

on:
  pull_request:
    paths:
      - "src/metal_predictor/live/**"
      - "src/metal_predictor/microstructure/**"
      - "src/metal_predictor/forward_bars/**"
      - "src/metal_predictor/shadow62/**"
      - "shadow_holdout/**"
      - "live_web/**"
      - "tests/test_live_platform.py"
      - "tests/test_live_market_gap.py"
      - "tests/test_gold_api_live_source.py"
      - "tests/test_live_time_audit.py"
      - "tests/test_spread_profit.py"
      - "tests/test_bullionvault_quotes.py"
      - "tests/test_microstructure_research.py"
      - "tests/test_forward_bar_*.py"
      - "tests/test_shadow62.py"
      - "requirements-live.txt"
      - "run_live.py"
      - "docker_entrypoint_live.py"
      - "Dockerfile.live"
      - "railway.json"
      - ".env.live.example"
      - ".gitignore"
      - "LIVE_PLATFORM.md"
      - "RAILWAY_DEPLOYMENT.md"
      - "BULLIONVAULT_FORWARD_BARS_STAGE4.md"
      - ".github/workflows/live-platform.yml"
  push:
    branches:
      - main
    paths:
      - "src/metal_predictor/live/**"
      - "src/metal_predictor/microstructure/**"
      - "src/metal_predictor/forward_bars/**"
      - "src/metal_predictor/shadow62/**"
      - "shadow_holdout/**"
      - "live_web/**"
      - "tests/test_live_platform.py"
      - "tests/test_live_market_gap.py"
      - "tests/test_gold_api_live_source.py"
      - "tests/test_live_time_audit.py"
      - "tests/test_spread_profit.py"
      - "tests/test_bullionvault_quotes.py"
      - "tests/test_microstructure_research.py"
      - "tests/test_forward_bar_*.py"
      - "tests/test_shadow62.py"
      - "requirements-live.txt"
      - "run_live.py"
      - "docker_entrypoint_live.py"
      - "Dockerfile.live"
      - "railway.json"
      - ".env.live.example"
      - ".gitignore"
      - "LIVE_PLATFORM.md"
      - "RAILWAY_DEPLOYMENT.md"
      - "BULLIONVAULT_FORWARD_BARS_STAGE4.md"
      - ".github/workflows/live-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-prediction-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install live dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt
          python -m pip install -e .
      - name: Compile live package
        run: python -m compileall -q src/metal_predictor/live src/metal_predictor/microstructure src/metal_predictor/forward_bars src/metal_predictor/shadow62 run_live.py docker_entrypoint_live.py
      - name: Run live platform tests
        run: python -m pytest tests/test_live_platform.py tests/test_live_market_gap.py tests/test_gold_api_live_source.py tests/test_live_time_audit.py tests/test_spread_profit.py tests/test_bullionvault_quotes.py tests/test_microstructure_research.py tests/test_forward_bar_factory.py tests/test_forward_bar_daily.py tests/test_shadow62.py

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build -f Dockerfile.live -t metalpredictor-live:ci .
      - name: Smoke-test production image with persistent volume
        run: |
          set -euo pipefail
          docker volume create metalpredictor-ci-data >/dev/null
          docker run -d \
            --name metalpredictor-live-ci \
            -e LIVE_ADMIN_TOKEN=ci-admin-token \
            -e LIVE_AUTO_COLLECT=false \
            -e BULLIONVAULT_MICROSTRUCTURE_ENABLED=false \
            -e BULLIONVAULT_FORWARD_BARS_ENABLED=false \
            -e BULLIONVAULT_FORWARD_BARS_DB_PATH=/data/bullionvault_forward_bars.sqlite3 \
            -e SHADOW62_ENABLED=false \
            -v metalpredictor-ci-data:/data \
            -p 18000:8000 \
            metalpredictor-live:ci >/dev/null
          cleanup() {
            docker logs metalpredictor-live-ci || true
            docker rm -f metalpredictor-live-ci >/dev/null 2>&1 || true
            docker volume rm metalpredictor-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/api/v1/health > health.json; then
              break
            fi
            sleep 1
          done
          test -s health.json
          curl -fsS http://127.0.0.1:18000/api/v1/research/shadow62/status > shadow62.json
          curl -fsS http://127.0.0.1:18000/api/v1/research/forward-bars/status > forward-bars.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text())
          assert payload["status"] == "ok"
          assert payload["edge_status"] == "NOT_PROVEN"
          assert payload["buy_sell_enabled"] is False

          shadow = json.loads(Path("shadow62.json").read_text())
          assert shadow["collection_enabled"] is False
          assert shadow["performance_metrics_available"] is False
          assert shadow["interim_scoring_enabled"] is False
          assert shadow["edge_status"] == "NOT_PROVEN"
          assert shadow["live_model_mutated"] is False
          assert shadow["frozen_52_feature_graph_mutated"] is False

          forward = json.loads(Path("forward-bars.json").read_text())
          assert forward["collection_enabled"] is False
          assert set(forward["horizons"]) == {"4h", "12h", "1d", "2d", "30d"}
          assert forward["safety"]["edge_status"] == "NOT_PROVEN"
          assert forward["safety"]["research_only"] is True
          assert forward["safety"]["buy_sell_enabled"] is False
          assert forward["safety"]["execution_enabled"] is False
          assert forward["safety"]["live_model_mutated"] is False
          assert forward["safety"]["frozen_52_feature_graph_mutated"] is False
          assert forward["safety"]["historical_chart_data_merged"] is False
          assert forward["safety"]["fill_or_interpolation_used"] is False
          PY

          test "$(docker exec metalpredictor-live-ci sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")" = "10001"
          docker exec --user 10001 metalpredictor-live-ci python -c "from pathlib import Path; p=Path('/data/ci-write-probe'); p.write_text('ok'); assert p.read_text() == 'ok'; p.unlink()"
