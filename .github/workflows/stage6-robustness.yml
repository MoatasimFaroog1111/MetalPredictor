name: Stage 6 Robustness and Multiple Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .

      - name: Run Stage 6 statistical and leakage tests
        run: pytest tests/test_pipeline.py tests/test_model_training.py tests/test_oof_stacking.py tests/test_stage6_robustness.py

      - name: Build leakage-safe Silver development data
        run: python build_training_dataset.py

      - name: Run CPCV PBO DSR and multiple-testing analysis
        run: python run_robustness_analysis.py

      - name: Show robustness report
        run: cat artifacts/robustness/robustness_report.json

      - name: Upload robustness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silver-stage6-robustness
          path: artifacts/robustness/
          if-no-files-found: error
