name: Frozen Future Holdout Collector

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frozen-future-holdout-ledger
  cancel-in-progress: false

env:
  FROZEN_CODE_SHA: '32fe84bfe745f6cd23300fdbee4aa6548bcaba8d'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable frozen code snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_CODE_SHA }}
          path: frozen
          persist-credentials: false

      - name: Verify frozen code SHA
        working-directory: frozen
        run: test "$(git rev-parse HEAD)" = "$FROZEN_CODE_SHA"

      - name: Checkout writable main ledger
        uses: actions/checkout@v4
        with:
          ref: main
          path: ledger
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frozen/requirements.txt

      - name: Install frozen collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frozen/requirements.txt
          python -m pip install frozen/

      - name: Append observations and frozen predictions without scoring
        run: |
          python frozen/collect_forward_holdout.py \
            --frozen-root "$GITHUB_WORKSPACE/frozen" \
            --ledger-root "$GITHUB_WORKSPACE/ledger"

      - name: Commit append-only ledger changes
        working-directory: ledger
        run: |
          git config user.name "metalpredictor-holdout-bot"
          git config user.email "metalpredictor-holdout-bot@users.noreply.github.com"
          git add forward_holdout/observations.csv \
                  forward_holdout/predictions.csv \
                  forward_holdout/collection_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new frozen-holdout rows."
            exit 0
          fi
          git commit -m "[holdout] append frozen future observations"
          git push origin HEAD:main
