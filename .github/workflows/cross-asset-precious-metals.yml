name: Cross-Asset Platinum Palladium Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/run-precious-metals-keyless-20260812

permissions:
  contents: read

jobs:
  precious-metals-feature-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .

      - name: Run precious-metals causal, coverage, provenance, and keyless-source tests
        run: |
          pytest tests/test_pipeline.py \
            tests/test_model_training.py \
            tests/test_cross_asset_precious_metals.py \
            tests/test_precious_metals_coverage.py \
            tests/test_precious_metals_provenance.py \
            tests/test_dukascopy_public_precious_metals.py

      - name: Build frozen Silver baseline development data
        run: python build_training_dataset.py

      - name: Build keyless XPT and XPD hourly research datasets
        run: python build_precious_metals_dataset.py

      - name: Show source acquisition report
        run: cat data/market/precious_metals_source_report.json

      - name: Assert keyless source, provenance, and no synthetic fill
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/market/precious_metals_source_report.json').read_text())
          assert report['source_access'] == 'KEYLESS_READ_ONLY_PUBLIC_HISTORY'
          assert report['provenance_gate']['status'] == 'PASS'
          assert report['provenance_gate']['validated_before_source_fetch'] is True
          for item in report['instruments']:
              assert item['authentication_required'] is False
              assert item['provenance_gate']['status'] == 'PASS'
              assert item['source_policy']['synthetic_flat_candles'] is False
              assert item['source_policy']['forward_fill'] is False
              assert item['source_policy']['interpolation'] is False
              assert item['exact_hour_rows'] == item['rows']
          print('Keyless Dukascopy source guards: PASS')
          PY

      - name: Build Silver plus pre-registered XPT/XPD candidate data
        run: python build_precious_metals_cross_asset_dataset.py

      - name: Validate provider coverage then compare on development only
        run: python compare_precious_metals_features.py

      - name: Show paired feature report
        run: cat artifacts/cross_asset_precious_metals/precious_metals_ab_report.json

      - name: Assert experiment isolation and provider coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/cross_asset_precious_metals/precious_metals_ab_report.json').read_text())
          assert report['research_policy']['test_data_read'] is False
          assert report['coverage_gate']['status'] == 'PASS'
          assert report['coverage_gate']['policy_fixed_before_result'] is True
          assert report['guardrails']['future_holdout_read'] is False
          assert report['guardrails']['old_test_read'] is False
          assert report['guardrails']['live_model_mutated'] is False
          assert report['guardrails']['frozen_52_feature_graph_mutated'] is False
          assert report['guardrails']['provider_coverage_validated_before_model_fit'] is True
          print('Research isolation and coverage guards: PASS')
          PY

      - name: Upload precious-metals research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silver-platinum-palladium-cross-asset-research
          path: |
            data/market/XPTUSD_H1_USD_PER_KG.parquet
            data/market/XPTUSD_H1_USD_PER_KG.csv
            data/market/XPTUSD_H1_USD_PER_KG_quality_report.json
            data/market/XPDUSD_H1_USD_PER_KG.parquet
            data/market/XPDUSD_H1_USD_PER_KG.csv
            data/market/XPDUSD_H1_USD_PER_KG_quality_report.json
            data/market/precious_metals_source_report.json
            data/processed_precious_metals/
            artifacts/cross_asset_precious_metals/
          if-no-files-found: error
