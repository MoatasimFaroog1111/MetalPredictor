name: Cross-Asset DXY Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dxy-feature-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-modeling.txt
          python -m pip install -e .

      - name: Run component and leakage tests
        run: pytest tests/test_pipeline.py tests/test_model_training.py tests/test_cross_asset_gold.py tests/test_cross_asset_dxy.py

      - name: Build silver baseline training data
        run: python build_training_dataset.py

      - name: Build UDX/DXY hourly dataset from HistData
        run: python build_dxy_dataset.py

      - name: Show DXY quality report
        run: cat data/market/UDXUSD_H1_quality_report.json

      - name: Build silver plus DXY training data
        run: python build_dxy_cross_asset_dataset.py

      - name: Compare A silver-only vs C silver-plus-DXY on development only
        run: python compare_dxy_features.py

      - name: Show paired DXY feature report
        run: cat artifacts/cross_asset_dxy/dxy_ac_report.json

      - name: Upload DXY research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silver-dxy-cross-asset-research
          path: |
            data/market/UDXUSD_H1_INDEX.parquet
            data/market/UDXUSD_H1_INDEX.csv
            data/market/UDXUSD_H1_quality_report.json
            data/processed_dxy/
            artifacts/cross_asset_dxy/
          if-no-files-found: error
