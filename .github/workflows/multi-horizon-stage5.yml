name: Multi-Horizon Stage 5 Research

on:
  pull_request:
    paths:
      - "src/metal_predictor/forward_bars/**"
      - "src/metal_predictor/live/forward_bar_runtime.py"
      - "live_web/forecast.*"
      - "tests/test_forward_bar_stage5.py"
      - ".github/workflows/multi-horizon-stage5.yml"
  push:
    branches: ["research/multi-horizon-stage5-forecast-pages"]
    paths:
      - "src/metal_predictor/forward_bars/**"
      - "src/metal_predictor/live/forward_bar_runtime.py"
      - "live_web/forecast.*"
      - "tests/test_forward_bar_stage5.py"
      - ".github/workflows/multi-horizon-stage5.yml"

permissions:
  contents: read

jobs:
  stage5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src/metal_predictor/forward_bars src/metal_predictor/live/forward_bar_runtime.py
      - name: Verify Stage 4 and Stage 5 isolation
        run: python -m pytest tests/test_forward_bar_factory.py tests/test_forward_bar_daily.py tests/test_forward_bar_stage5.py
